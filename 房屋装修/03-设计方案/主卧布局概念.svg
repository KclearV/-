<svg xmlns="http://www.w3.org/2000/svg" width="950" height="700" viewBox="0 0 950 700">
<defs><pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#dce2e8" stroke-width="1"/></pattern></defs>
<rect width="950" height="700" fill="#f7f8fa"/><rect x="20" y="20" width="910" height="660" rx="18" fill="url(#grid)" stroke="#cbd5df"/>
<text x="50" y="65" font-family="sans-serif" font-size="27" font-weight="700" fill="#24364b">主卧布局概念示意</text><text x="50" y="96" font-family="sans-serif" font-size="16" fill="#667789">按原户型图比例关系简化绘制｜门窗与柜体尺寸需现场复测</text>
<!-- room boundary plan: room 305 wide, length 430-475 -->
<path d="M295 185 H725 V520 H295 Z" fill="#fffdf8" stroke="#333e4a" stroke-width="18" stroke-linejoin="round"/>
<!-- top entrance gap -->
<path d="M318 176 V245 Q390 245 390 176" fill="none" stroke="#64748b" stroke-width="3"/><path d="M318 185 H390" stroke="#f7f8fa" stroke-width="14"/>
<text x="295" y="155" font-family="sans-serif" font-size="18" fill="#34495e">入户门（沿用原图位置）</text>
<!-- wardrobe L upper and left wall at entrance -->
<path d="M405 194 H688 V284 H480 V376 H405 Z" fill="#ecd8bd" stroke="#a97845" stroke-width="4"/>
<path d="M430 214 H664 M430 238 H664 M430 262 H664" stroke="#c29a6d" stroke-width="3"/>
<path d="M432 214 V272 M460 214 V272 M488 214 V272" stroke="#8c6743" stroke-width="2"/>
<text x="510" y="231" font-family="sans-serif" font-size="21" font-weight="700" fill="#583e25">L 型衣帽间（概念）</text><text x="510" y="260" font-family="sans-serif" font-size="16" fill="#684d31">柜深暂按约 0.60 m 讨论</text>
<text x="414" y="335" font-family="sans-serif" font-size="15" fill="#684d31" transform="rotate(-90 414 335)">转角收纳柜</text>
<!-- open circulation route -->
<path d="M390 300 C410 380 470 400 520 415" fill="none" stroke="#6c91b1" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrow)"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6" fill="none" stroke="#6c91b1" stroke-width="1.5"/></marker></defs>
<text x="365" y="420" font-family="sans-serif" font-size="16" fill="#486982">进门后保留通道</text>
<!-- bed -->
<rect x="465" y="345" width="200" height="130" rx="14" fill="#e8edf2" stroke="#8593a1" stroke-width="3"/><rect x="480" y="355" width="82" height="35" rx="10" fill="#fff" stroke="#b5c0ca"/><rect x="568" y="355" width="82" height="35" rx="10" fill="#fff" stroke="#b5c0ca"/><text x="535" y="435" font-family="sans-serif" font-size="22" fill="#465566">床</text>
<!-- bay window at bottom -->
<path d="M385 520 V575 H675 V520" fill="#eff8fa" stroke="#607987" stroke-width="8"/><path d="M390 548H670" stroke="#9bb4bd" stroke-width="3"/>
<rect x="430" y="516" width="200" height="40" rx="6" fill="#a9d5e8" stroke="#4185a1" stroke-width="3"/><text x="440" y="543" font-family="sans-serif" font-size="17" font-weight="700" fill="#14526b">可升降书桌台（概念）</text>
<path d="M625 534V510 M618 516L625 509L632 516 M618 528L625 535L632 528" stroke="#286d8b" stroke-width="2.5" fill="none"/><text x="475" y="603" font-family="sans-serif" font-size="17" fill="#435766">主卧飘窗（原图面积约 1.75 m²）</text>
<!-- labels -->
<rect x="740" y="188" width="160" height="126" rx="12" fill="#fff" stroke="#cbd5df"/><text x="760" y="220" font-family="sans-serif" font-size="18" font-weight="700" fill="#34495e">图例</text><rect x="760" y="240" width="22" height="18" fill="#ecd8bd" stroke="#a97845"/><text x="792" y="255" font-family="sans-serif" font-size="15" fill="#34495e">衣帽间概念</text><rect x="760" y="275" width="22" height="18" fill="#a9d5e8" stroke="#4185a1"/><text x="792" y="290" font-family="sans-serif" font-size="15" fill="#34495e">升降桌概念</text>
<text x="740" y="355" font-family="sans-serif" font-size="16" fill="#526374">设计说明</text><text x="740" y="386" font-family="sans-serif" font-size="14" fill="#526374">1. 衣柜暂放入门侧，</text><text x="740" y="409" font-family="sans-serif" font-size="14" fill="#526374">形成 L 形遮挡与收纳。</text><text x="740" y="446" font-family="sans-serif" font-size="14" fill="#526374">2. 飘窗桌需确认窗扇</text><text x="740" y="469" font-family="sans-serif" font-size="14" fill="#526374">开启、采光与插座。</text><text x="740" y="506" font-family="sans-serif" font-size="14" fill="#526374">3. 柜深、过道净宽、</text><text x="740" y="529" font-family="sans-serif" font-size="14" fill="#526374">床位与门扇均需复尺。</text>
<text x="50" y="646" font-family="sans-serif" font-size="14" fill="#7b8792">概念方案，非施工图；图中柜体位置为方案假设，需结合现场墙体、门洞和飘窗结构调整。</text>
</svg>
