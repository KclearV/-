<text x="50" y="1056" fill="#dbe5eb" font-family="Noto Sans CJK SC,sans-serif" font-size="18">② 床后下柜不设被床挡住的平开门，拟凹槽内翻盖取物；上柜后退150，校核坐起净空。</text>
